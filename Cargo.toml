[package]
name = "cosmic-applet-clippy-land"
version = "1.1.0"
authors = ["k33wee (https://github.com/k33wee)"]
edition = "2024"
license = "GPL-3.0-or-later"
description = "Clipboard history applet for COSMIC desktop environment"

[dependencies]
bitflags = "2"
bytes = "1.12"
futures-util = "0.3.34"
i18n-embed-fl = "0.10"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
os_pipe = "1.2.3"
png = "0.18.1"
rust-embed = "8.13.0"
rustix = { version = "1.1", features = ["event", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.8"
wl-clipboard-rs = "0.9.4"
wayland-backend = "0.3"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "unstable"] }
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wayland-scanner = "0.31"
xkbcommon = "0.8"
zbus = "5.19"

[dependencies.i18n-embed]
version = "0.16"
features = ["fluent-system", "desktop-requester"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
default-features = false
# See https://github.com/pop-os/libcosmic/blob/master/Cargo.toml for available features.
features = [
    # COSMIC applet support. This pulls in the Wayland/winit/tokio/multi-window pieces needed by applets.
    "applet",
    # Uses cosmic-settings-daemon to watch for config file changes
    "dbus-config",
]

# Uncomment to test a locally-cloned libcosmic
# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { path = "../libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }
